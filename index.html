<!DOCTYPE html>
<html lang="KO">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Avoid Boxes</title>

        <link rel="stylesheet" href="css/style.css">
    </head>
    <body>
        <div id="layout" style="display:flex; align-items:flex-start; justify-content:center; gap:24px; padding:20px;">
            <div id="canvasWrap" style="flex:0 0 auto;">
                <canvas id="gameCanvas" width="400" height="500" style="margin:0; display:block;"></canvas>
            </div>
            <div id="controls" style="display:flex; flex-direction:column; gap:16px; align-items:flex-start; margin-left:20px;">
                <!-- HUD: 스코어, 난이도(레벨), 스킬/업그레이드 상태 -->
                <div id="game-hud" style="background:#fff8; padding:8px 12px; border-radius:8px; min-width:200px;">
                    <div style="font-weight:700; margin-bottom:6px;">게임 정보</div>
                    <div>점수: <span id="hud-score">0</span></div>
                    <div>난이도: <span id="hud-level">1</span></div>
                    <div>스킬(보유): <span id="hud-skills">1</span></div>
                    <div style="font-size:12px; color:#333; margin-top:6px;">업그레이드: <span id="hud-upgrades">데미지 x1.0 / 속도 x1.0 / 탄환 1</span></div>
                </div>
                <div style="display:flex; gap:8px; margin-top:8px;">
                    <button id="startButton">게임시작</button>
                    <button id="helpButton">게임설명</button>
                </div>
            </div>
        </div>

    <script src="js/player.js"></script>
    <script src="js/monsters.js"></script>
    <script src="js/level.js"></script>
    <script src="js/main.js"></script>
    </body>
</html>
